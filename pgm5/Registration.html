<html>
<head>
<title>Registration Form</title>
</head>
<body>
<h3 align="center">Registration Form</h3>
<form>
<table cellpadding="10" align="center" bgcolor="lightblue">
<tr>
<td>Name</td>
<td><input type="text" name="Name">
</td></tr>
<tr>
<td>Mobile number</td>
<td><input type="tel" name="mobile">
</td></tr>
<tr><td>Email ID</td>
<td><input type="email" name="email">
</td></tr>
<tr>
<td>Age</td>
<td><input type="number" name="age">
</td></tr>
<tr>
<td>Gender</td>
<td><input type="radio" name="gender">Male
<input type="radio" name="gender">Female
<input type="radio" name="gender">Others</td></tr>
<tr>
<td>Address</td>
<td><textarea row="6" cols="30">
</textarea>
</td></tr>
<tr>
<td>Date of birth</td>
<td><input type="date" name="dob">
</td>
</tr>
<tr>
<td>Current study</td>
<td><select>
<option>B Tech</option>
<option>BCA</option>
<option>MCA</option>
<option>M Tech</option>
</select>
</td></tr>
<tr><td>Department</td>
<td><select>
<option>CS</option>
<option>EC</option>
<option>ME</option>
<option>CE</option>
</select>
</td></tr>
<tr>
<td>Upload CV</td>
<td><input type="file"></td></tr>
<tr>
<td>Programming language</td>
<td>
<input type="checkbox">HTML
<input type="checkbox">Reactjs
<input type="checkbox">CSS
<input type="checkbox">Flutter
</td></tr>
<tr>
<td>languages</td>
<td><input type="checkbox">English
<input type="checkbox">Malayalam
<input type="checkbox">Arabic
<input type="checkbox">Hindi
</td></tr>
<tr>
<td><input type="submit" value="submit"></td>
<td><input type="reset" value"reset">
</td></tr>
</table>
</form>
</body>
</html>
